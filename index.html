<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>STMSPS • WebGIS (Static GeoJSON)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

<style>
  :root{
    --accent:#1a237e;
    --accent-2:#0d47a1;
    --brand:#ffc107;
    --panel:#ffffff;
    --shadow:0 12px 30px rgba(0,0,0,.15);
    --text:#1f2937;
  }
  *{ box-sizing:border-box }
  html,body{ height:100%; margin:0; background:#f6f7fb; color:var(--text); font-family:'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #map{ position:absolute; inset:0; }

  /* Header */
  #topbar{
    position:fixed; top:0; left:0; right:0; height:52px; z-index:1500;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--accent); color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  #topbar img{ height:30px; width:auto; }
  #topbar h1{ margin:0; font-size:15px; font-weight:700; letter-spacing:.2px; }

  /* Panels */
  .panel{ background:var(--panel); border-radius:12px; box-shadow:var(--shadow); }
  #left-panel{
    position:fixed; top:64px; left:12px; width:320px; z-index:1500;
    display:flex; flex-direction:column; gap:10px;
  }
  #satwil-panel{ padding:10px; }
  #satwil-panel h3{ margin:0 0 6px 0; font-size:14px; font-weight:700; color:#111827; }
  #satwil-panel .row{ display:flex; gap:6px; }
  select, input[type="text"]{
    width:100%; padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px; font-size:13px;
    outline:none; background:#fff;
  }
  .btn{ padding:10px 12px; border:0; background:var(--brand); color:#111; font-weight:700; border-radius:10px; cursor:pointer; }
  .btn:hover{ filter:brightness(1.05); }

  #search-panel{ padding:10px; }
  #search-panel h3{ margin:0 0 6px 0; font-size:14px; font-weight:700; }
  #results{ margin-top:6px; max-height:180px; overflow:auto; border:1px solid #eee; border-radius:8px; display:none; }
  .result-item{ padding:8px 10px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:13px; }
  .result-item:hover{ background:#f9fafb; }
  .result-empty{ padding:10px; color:#6b7280; font-size:12px; }

  #bottom-panel{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:10px; width:380px; z-index:1500;
  }
  #tabs{ display:flex; gap:6px; padding:8px; background:#fff; border-radius:12px 12px 0 0; box-shadow:var(--shadow); }
  .tab-btn{
    flex:1; padding:8px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .tab-btn.active{ color:#fff; background:var(--accent); border-color:var(--accent); }
  #tab-body{ background:#fff; padding:12px; border-radius:0 0 12px 12px; box-shadow:var(--shadow); }
  .layer-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .layer-item{ display:flex; gap:6px; align-items:center; font-size:13px; }
  .legend-item{ display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
  .legend-swatch{ width:18px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.15) }
  .legend-line{ width:28px; height:0; border-top:3px solid #333; }
  .legend-icon{ width:20px; height:20px; display:inline-block; }

  /* Loading */
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; gap:16px;
    background:rgba(26,35,126,.92); color:#fff; z-index:2000; flex-direction:column; font-weight:700;
  }
  #loading img{ width:110px; height:auto; animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse{ 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }

  /* Mobile */
  @media(max-width: 860px){
    #left-panel{ width:92%; left:50%; transform:translateX(-50%); top:60px; }
    #bottom-panel{ width:92%; left:50%; transform:translateX(-50%); }
  }
</style>
</head>
<body>

<div id="topbar">
  <img src="./assets/korlantas25.png" alt="KorLantas">
  <h1>Smart Traffic Management System for Public Safety • WebGIS</h1>
</div>

<div id="loading">
  <img src="./assets/korlantas25.png" alt="Memuat..." />
  <div>Memuat Peta & Data…</div>
</div>

<div id="left-panel">
  <!--  Satwil selector  -->
  <div id="satwil-panel" class="panel">
    <h3>Pilih Satwil</h3>
    <div class="row">
      <select id="satwil-select" aria-label="Pilih Satwil">
        <option value="" selected>Semua Satwil</option>
      </select>
      <button id="btn-apply-satwil" class="btn">Terapkan</button>
    </div>
    <small id="satwil-hint" style="display:block; margin-top:6px; color:#6b7280;">
      Sumber: <code>./data/wilayah.geojson</code> (kolom <b>Satwil</b> atau <b>satwil</b>)
    </small>
  </div>

  <!--  Search  -->
  <div id="search-panel" class="panel">
    <h3>Pencarian (Nama / Jalan / Keterangan)</h3>
    <input id="search-input" type="text" placeholder="Ketik minimal 2 huruf…" />
    <div id="results"></div>
  </div>
</div>

<div id="bottom-panel">
  <div id="tabs">
    <button class="tab-btn active" data-tab="basemap">Basemap</button>
    <button class="tab-btn" data-tab="layers">Layer</button>
    <button class="tab-btn" data-tab="legend">Legenda</button>
  </div>
  <div id="tab-body" class="panel">
    <!-- Basemap -->
    <div class="tab-content" id="tab-basemap">
      <div style="display:flex; gap:8px;">
        <button class="btn" data-basemap="osm"   style="flex:1;">OpenStreetMap</button>
        <button class="btn" data-basemap="esri"  style="flex:1;">ESRI Topo</button>
        <button class="btn" data-basemap="img"   style="flex:1;">Imagery</button>
      </div>
      <small style="display:block; margin-top:8px; color:#6b7280;">
        Untuk penggunaan produksi, pertimbangkan penyedia tile berbayar atau server tile sendiri.
      </small>
    </div>

    <!-- Layers -->
    <div class="tab-content" id="tab-layers" style="display:none;">
      <div class="layer-list">
        <label class="layer-item"><input type="checkbox" data-layer="troublespot" checked/>Troublespot</label>
        <label class="layer-item"><input type="checkbox" data-layer="blackspot" checked/>Black Spot</label>
        <label class="layer-item"><input type="checkbox" data-layer="traffic" checked/>Kemacetan</label>
        <label class="layer-item"><input type="checkbox" data-layer="blacklink" checked/>Black Link</label>
        <label class="layer-item"><input type="checkbox" data-layer="blackarea" checked/>Black Area</label>
        <label class="layer-item"><input type="checkbox" data-layer="objek_vital" checked/>Objek Vital</label>
        <label class="layer-item"><input type="checkbox" data-layer="cctv" checked/>CCTV</label>
        <label class="layer-item"><input type="checkbox" data-layer="prediksi_risiko"/>Prediksi Risiko</label>
        <label class="layer-item"><input type="checkbox" data-layer="administrasi" checked/>Administrasi</label>
      </div>
    </div>

    <!-- Legend -->
    <div class="tab-content" id="tab-legend" style="display:none;">
      <div id="legend-content"></div>
    </div>
  </div>
</div>

<div id="map" aria-label="Peta WebGIS"></div>

<script>

/* =========================================================
   Globals
   ========================================================= */
let map;
let allData = {};      // key -> FeatureCollection
let filtered = {};     // key -> FeatureCollection (after Satwil filter)
let wilayahFC = null;  // polygon source for Satwil
let currentSatwilPolygon = null;
let fuseIndex = null;

/* =========================================================
   Bootstrap
   ========================================================= */
init();

async function init(){
  // Map
  map = new maplibregl.Map({
    container:'map',
    style:{
      version:8,
      sources:{ 'base':{ type:'raster', tiles: BASEMAPS.osm.tiles, tileSize:BASEMAPS.osm.tileSize } },
      layers:[ { id:'base-layer', type:'raster', source:'base' } ]
    },
    center:[118.0149, -2.5489],
    zoom:4.6,
    attributionControl:false,
    renderWorldCopies:false
  });
  map.setMaxBounds([[94.5, -12.5], [142.0, 8.0]]);
  map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'bottom-right');
  map.addControl(new maplibregl.AttributionControl({ compact:true }), 'bottom-right');

  map.on('load', async ()=>{
    await addIcons();
    await loadAllGeoJSON();
    buildSatwilSelect();
    addAllLayers();
    applySatwilFilter(null); // all
    buildLegend();
    buildSearchIndex();
    wireUI();
    hideLoading();
  });
}

function hideLoading(){ const el = document.getElementById('loading'); if(el) el.style.display='none'; }

/* =========================================================
   UI Wiring
   ========================================================= */
function wireUI(){
  // Tabs
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(btn=>btn.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    ['basemap','layers','legend'].forEach(id=> document.getElementById('tab-'+id).style.display = (btn.dataset.tab===id?'block':'none'));
  }));

  // Basemap buttons
  document.querySelectorAll('[data-basemap]').forEach(b=>{
    b.addEventListener('click', ()=> switchBasemap(b.dataset.basemap));
  });

  // Layer toggles
  document.querySelectorAll('[data-layer]').forEach(chk=>{
    chk.addEventListener('change', ()=> toggleLayerVisibility(chk.dataset.layer, chk.checked));
  });

  // Satwil
  document.getElementById('btn-apply-satwil').addEventListener('click', ()=>{
    const v = document.getElementById('satwil-select').value || null;
    applySatwilFilter(v);
  });

  // Search
  const input = document.getElementById('search-input');
  const results = document.getElementById('results');
  input.addEventListener('input', ()=>{
    const q = input.value.trim();
    if (q.length < 2) { results.style.display='none'; results.innerHTML=''; return; }
    const hits = fuseIndex? fuseIndex.search(q).slice(0,30) : [];
    if (!hits.length){ results.style.display='block'; results.innerHTML = '<div class="result-empty">Tidak ada hasil</div>'; return; }
    results.style.display='block';
    results.innerHTML = hits.map(h=>{
      const f = h.item;
      const name = (f.properties.Nama || f.properties.Nm_Ruas || f.properties.nama || f.properties.nama_jalan || f.properties.keterangan || 'Feature');
      const src = f.properties._layerKey || 'data';
      return `<div class="result-item" data-layer="${src}" data-idx="${f.properties._idx||0}"><strong>${escapeHtml(name)}</strong><br><small>${escapeHtml(src)}</small></div>`;
    }).join('');

    Array.from(results.querySelectorAll('.result-item')).forEach(el=>{
      el.addEventListener('click', ()=>{
        const layer = el.dataset.layer;
        const idx = Number(el.dataset.idx||0);
        const f = (filtered[layer]?.features || [])[idx];
        if (!f) return;
        zoomToFeature(f);
        showPopupForFeature(f);
        results.style.display='none';
      });
    });
  });
}

function switchBasemap(key){
  const cfg = BASEMAPS[key] || BASEMAPS.osm;
  try{
    if (map.getLayer('base-layer')) map.removeLayer('base-layer');
    if (map.getSource('base')) map.removeSource('base');
  }catch(e){}
  map.addSource('base', { type:'raster', tiles:cfg.tiles, tileSize:cfg.tileSize });
  map.addLayer({ id:'base-layer', type:'raster', source:'base' }, getFirstNonBaseLayerId());
}

function toggleLayerVisibility(prefix, visible){
  const ids = (map.getStyle().layers||[]).map(l=>l.id).filter(id=> id.startsWith(prefix));
  ids.forEach(id=> map.setLayoutProperty(id, 'visibility', visible?'visible':'none'));
  buildLegend();
}

function getFirstNonBaseLayerId(){
  const layers = map.getStyle().layers || [];
  const first = layers.find(l => l.id !== 'base-layer');
  return first? first.id : undefined;
}

/* =========================================================
   Data loading & normalization
   ========================================================= */
async function loadAllGeoJSON(){
  // Always try to load wilayah first
  wilayahFC = await loadFile(DATA_FILES.wilayah).catch(()=>({ type:'FeatureCollection', features:[] }));
  allData['wilayah'] = wilayahFC;

  // Others are optional
  for (const key of Object.keys(DATA_FILES)){
    if (key === 'wilayah') continue;
    try{
      const fc = await loadFile(DATA_FILES[key]);
      allData[key] = normalizeProperties(key, fc);
    }catch(e){
      console.warn('Lewati (file tidak ada):', key);
      allData[key] = { type:'FeatureCollection', features:[] };
    }
  }
}

async function loadFile(base){
  const url = `./data/${base}.geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Tidak bisa memuat '+url);
  return await res.json();
}

function normalizeProperties(layerKey, fc){
  if (!fc || !Array.isArray(fc.features)) return fc;
  let idx = 0;
  for (const f of fc.features){
    f.properties = f.properties || {};
    f.properties._layerKey = layerKey;
    f.properties._idx = idx++;

    // tanggal normalizer
    if (['blackspot','blacklink','blackarea'].includes(layerKey)){
      const raw = f.properties.tanggal || f.properties.tgl || f.properties.date || f.properties.datetime || null;
      const d = parseLocalDateLoose(raw);
      if (d) f.properties.tanggal = toYMD(d);
    }
    if (layerKey === 'cctv'){
      const raw = (f.properties.status || f.properties.STATUS || f.properties.stat || '').toString().toLowerCase();
      if (['on','hidup','1','aktif'].includes(raw)) f.properties.status = 'Hidup';
      else if (['off','mati','0','nonaktif'].includes(raw)) f.properties.status = 'Mati';
      else f.properties.status = 'Unknown';
    }
    if (layerKey === 'objek_vital'){
      f.properties.Keterangan = (f.properties.Keterangan || f.properties.keterangan || f.properties.kategori || 'Lainnya');
    }
    if (layerKey === 'blackspot'){
      f.properties.SkorBS = Number(f.properties.SkorBS ?? f.properties.skor ?? f.properties.score ?? 0);
      f.properties.Nama = f.properties.Nama || f.properties.Nm_Ruas || f.properties.nama || f.properties.nama_ruas || 'Black Spot';
    }
  }
  return fc;
}

function buildSatwilSelect(){
  const sel = document.getElementById('satwil-select');
  const seen = new Set();
  for (const f of wilayahFC.features || []){
    const sat = getSatwil(f.properties);
    if (!sat || seen.has(sat)) continue;
    seen.add(sat);
    const opt = document.createElement('option');
    opt.value = sat; opt.textContent = sat;
    sel.appendChild(opt);
  }
}

function getSatwil(props){
  for (const k of SATWIL_FIELDS){
    if (props && props[k]) return String(props[k]);
  }
  return null;
}

/* =========================================================
   Filtering by Satwil
   ========================================================= */
function applySatwilFilter(satwilName){
  currentSatwilPolygon = null;
  if (!satwilName){
    filtered = { ...allData };
  }else{
    // Find polygon for Satwil
    const ff = (wilayahFC.features||[]).find(f => getSatwil(f.properties) === satwilName);
    if (!ff){ alert('Satwil tidak ditemukan di data wilayah'); return; }
    currentSatwilPolygon = ff;
    filtered = {};
    filtered['wilayah'] = wilayahFC;
    for (const key of Object.keys(allData)){
      if (key === 'wilayah') continue;
      filtered[key] = filterFCByPolygon(key, allData[key], ff);
    }
  }
  updateSources();
  fitToSelection();
  buildLegend();
  buildSearchIndex();
}

function filterFCByPolygon(layerKey, fc, polygon){
  if (!fc || !Array.isArray(fc.features)) return { type:'FeatureCollection', features:[] };
  const pointLayers = ['cctv','objek_vital','troublespot','blackspot'];
  if (pointLayers.includes(layerKey)){
    const points = toPointFeatures(fc);
    return {
      type:'FeatureCollection',
      features: points.filter(pt => safeWithin(pt, polygon))
    };
  }
  // For line/polygon: intersect or within
  const out = [];
  for (const f of fc.features){
    try{
      if (!f.geometry) continue;
      const g = f.geometry.type;
      if (g === 'LineString' || g === 'MultiLineString'){
        if (turf.booleanIntersects(f, polygon)) out.push(f);
      }else if (g === 'Polygon' || g === 'MultiPolygon'){
        const inter = turf.intersect(f, polygon);
        if (inter){ inter.properties = { ...f.properties }; out.push(inter); }
      }else{
        if (turf.booleanIntersects(f, polygon)) out.push(f);
      }
    }catch(e){ /* ignore */ }
  }
  return { type:'FeatureCollection', features: out };
}

function toPointFeatures(fc){
  const out = [];
  for (const f of (fc.features||[])){
    if (!f || !f.geometry) continue;
    const g = f.geometry;
    if (g.type === 'Point') out.push(f);
    else if (g.type === 'MultiPoint'){
      for (const c of (g.coordinates||[])){
        out.push({ type:'Feature', geometry:{ type:'Point', coordinates:c }, properties:{ ...(f.properties||{}) } });
      }
    }else{
      try{
        const cen = turf.centroid(f).geometry.coordinates;
        out.push({ type:'Feature', geometry:{ type:'Point', coordinates:cen }, properties:{ ...(f.properties||{}), _from:g.type } });
      }catch(e){}
    }
  }
  return out;
}

function safeWithin(pt, poly){
  try{ return turf.booleanPointInPolygon(pt, poly); }catch(e){ return false; }
}

  }
}

function emptyFC(){ return { type:'FeatureCollection', features:[] }; }

function updateSources(){
  // wilayah (always full)
  if (map.getSource('wilayah')) map.getSource('wilayah').setData(wilayahFC);

  // troublespot
  map.getSource('troublespot')?.setData(filtered.troublespot || emptyFC());

  // blackspot
  map.getSource('blackspot')?.setData(filtered.blackspot || emptyFC());

  // traffic
  map.getSource('traffic')?.setData(filtered.traffic || emptyFC());

  // blacklink
  map.getSource('blacklink')?.setData(filtered.blacklink || emptyFC());

  // blackarea
  map.getSource('blackarea')?.setData(filtered.blackarea || emptyFC());

  // CCTV split on/off
  const onFC = {
    type:'FeatureCollection',
    features:(filtered.cctv?.features||[]).filter(f => (f.properties.status||'').toString().toLowerCase()==='hidup')
  };
  const offFC = {
    type:'FeatureCollection',
    features:(filtered.cctv?.features||[]).filter(f => (f.properties.status||'').toString().toLowerCase()==='mati')
  };
  map.getSource('cctv-on')?.setData(onFC);
  map.getSource('cctv-off')?.setData(offFC);

  // Objek vital buckets
  const buckets = {};
  for (const k of Object.keys(OV_META)) buckets[k] = [];
  for (const f of (filtered.objek_vital?.features||[])){
    const raw = (f.properties.Keterangan || f.properties.keterangan || '').toString().trim().toLowerCase();
    const key = OV_META[raw] ? raw : 'default';
    buckets[key].push(f);
  }
  for (const key of Object.keys(OV_META)){
    map.getSource(`objek_vital-${key}`)?.setData({ type:'FeatureCollection', features:buckets[key]||[] });
  }

  // prediksi
  map.getSource('prediksi_risiko')?.setData(filtered.prediksi_risiko || emptyFC());

  // administrasi
  map.getSource('administrasi')?.setData(filtered.administrasi || emptyFC());
}

function fitToSelection(){
  try{
    let bounds;
    if (currentSatwilPolygon){
      bounds = turf.bbox(currentSatwilPolygon);
    }else if (wilayahFC.features?.length){
      bounds = turf.bbox(wilayahFC);
    }
    if (bounds) map.fitBounds(bounds, { padding: 40, maxZoom: 12 });
  }catch(e){}
}

    html += `<div class="legend-item"><span class="legend-icon">${svgImg('kecelakaan')}</span>Kecelakaan</div>`;
  }

  }
  if (show('traffic')){

  if (show('blacklink')){

    html += `<div class="legend-item"><span class="legend-line" style="border-top-color:#212121; border-top-width:5px"></span> Tercakup CCTV</div>`;
  }
  if (show('blackarea')){
    html += `<div class="legend-item"><span class="legend-swatch" style="background:rgba(192,192,192,.6)"></span> Black Area</div>`;
  }
  if (show('objek_vital')){
    for (const k of Object.keys(OV_META)){
      if (k==='default') continue;
      html += `<div class="legend-item"><span class="legend-icon">${svgImg(OV_META[k].icon)}</span>${OV_META[k].label}</div>`;
    }
  }
  if (show('cctv')){
    html += `<div class="legend-item"><span class="legend-icon">${svgImg('cctv-on')}</span>CCTV Hidup</div>`;
    html += `<div class="legend-item"><span class="legend-icon">${svgImg('cctv-off')}</span>CCTV Mati</div>`;
  }
  if (show('prediksi_risiko')){

    html += `<div class="legend-item"><span class="legend-swatch" style="background:#ffeb3b"></span> Risiko Sedang</div>`;
    html += `<div class="legend-item"><span class="legend-swatch" style="background:#f44336"></span> Risiko Tinggi</div>`;
  }
  if (show('administrasi')){
    html += `<div class="legend-item"><span class="legend-line" style="border-top-color:#ffffff; border-top-width:3px"></span> Batas Administrasi</div>`;
  }

  cont.innerHTML = html || '<div style="color:#6b7280">Tidak ada layer aktif.</div>';
}

function isLayerVisible(prefix){
  const ids = (map.getStyle().layers||[]).map(l=>l.id).filter(id=> id.startsWith(prefix));
  if (!ids.length) return false;
  return ids.some(id => (map.getLayoutProperty(id, 'visibility') ?? 'visible') !== 'none');
}

function svgImg(iconId){
  const svg = ICON_SVGS[iconId] || ICON_SVGS.default;
  return `<img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" width="18" height="18">`;
}

/* =========================================================
   Search (Fuse.js) across filtered features
   ========================================================= */
function buildSearchIndex(){
  const items = [];
  const keys = Object.keys(filtered).filter(k => k!=='wilayah');
  for (const key of keys){
    const feats = filtered[key]?.features || [];
    for (let i=0;i<feats.length;i++){
      const f = feats[i];
      f.properties._layerKey = key;
      f.properties._idx = i;
      items.push(f);
    }
  }
  fuseIndex = new Fuse(items, { includeScore:false, minMatchCharLength:2, keys:['properties.Nama','properties.Nm_Ruas','properties.nama','properties.nama_jalan','properties.keterangan'] });
}

/* =========================================================
   Popups & helpers
   ========================================================= */
function showPopupForFeature(f){
  const p = f.properties || {};
  const title = p.Nama || p.Nm_Ruas || p.nama || p.nama_jalan || p.keterangan || 'Informasi';
  let html = `<div style="font-weight:700; background:${cssVar('--accent')}; color:#fff; padding:6px 10px; border-radius:8px 8px 0 0;">${escapeHtml(title)}</div><div style="padding:8px 10px; max-width:280px;">`;
  for (const [k,alias] of Object.entries(ALIAS)){
    if (Object.prototype.hasOwnProperty.call(p,k)){
      html += `<div><strong>${escapeHtml(alias)}:</strong> ${escapeHtml(String(p[k]))}</div>`;
    }
  }
  html += `</div>`;

  const coords = getFeatureLngLat(f);
  if (!coords) return;
  new maplibregl.Popup({ closeButton:true, offset:12 }).setLngLat(coords).setHTML(html).addTo(map);
}

function zoomToFeature(f){
  try{
    const g = f.geometry;
    if (!g) return;
    if (g.type==='Point'){
      map.easeTo({ center:g.coordinates, zoom:15 });
    }else{
      const bbox = turf.bbox(f);
      map.fitBounds(bbox, { padding:40, maxZoom:16 });
    }
  }catch(e){}
}

function getFeatureLngLat(f){
  try{
    const g = f.geometry;
    if (!g) return null;
    if (g.type==='Point') return g.coordinates;
    return turf.centroid(f).geometry.coordinates;
  }catch(e){ return null; }
}

function parseLocalDateLoose(raw){
  if (!raw) return null;
  if (raw instanceof Date) return new Date(raw.getFullYear(), raw.getMonth(), raw.getDate());
  const s = String(raw).trim();
  const iso = /[T ]\d{2}:\d{2}(:\d{2}(\.\d{1,3})?)?(Z|[+\-]\d{2}:\d{2})$/.test(s) || /Z$/.test(s);
  if (iso){ const d = new Date(s); if (!isNaN(d)) return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  const m1 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (m1) return new Date(+m1[1], +m1[2]-1, +m1[3]);
  const m2 = s.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/); if (m2) return new Date(+m2[3], +m2[2]-1, +m2[1]);
  const d = new Date(s); if (!isNaN(d)) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return null;
}
function toYMD(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; }

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name) || ''; }
</script>

    var labelMap = {
      'cctv-on':'C','cctv-off':'C','blackspot':'B','kemacetan':'M','kecelakaan':'K','road-closed':'X','road-disturbance':'!',
      'ov-plane':'✈','ov-hospital':'H','ov-school':'S','ov-government':'G','ov-police':'P','ov-train':'T','ov-bus':'B',
      'ov-pariwisata':'W','ov-port':'⛵','default':'•'
    };
    var fill = colorMap[id] || colorMap.default;
    var txt = labelMap[id] || labelMap.default;
    // pin
    ctx.beginPath();
    ctx.arc(size/2, size/2 - 4, size*0.38, 0, Math.PI*2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    // pointer
    ctx.beginPath();
    ctx.moveTo(size/2 - 6, size/2 + 6);
    ctx.lineTo(size/2, size - 4);
    ctx.lineTo(size/2 + 6, size/2 + 6);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, size/2, size/2 - 4);
    return c;
  }

  // daftar id ikon yang digunakan app (dari log error kamu)
  var ICON_IDS = [
    'road-closed','road-disturbance','kemacetan','kecelakaan','blackspot','cctv-on','cctv-off',
    'ov-plane','ov-hospital','ov-school','ov-government','ov-police','ov-train','ov-bus','ov-pariwisata','ov-port','default'
  ];

  function registerDefaultIcons(map){
    if (!map || map.__inlineIconsRegistered) return;
    map.__inlineIconsRegistered = true;
    // pre-register semua id agar layer point langsung dapat image
    ICON_IDS.forEach(function(id){
      try {
        if (!map.hasImage(id)) map.addImage(id, makeIconCanvas(id), { pixelRatio: 2 });
      } catch(e) { /* ignore */ }
    });

    // fallback kalau ada id lain yang belum terdaftar
    map.on('styleimagemissing', function(e){
      var id = (e && e.id) || 'default';
      if (map.hasImage(id)) return;
      try { map.addImage(id, makeIconCanvas(id), { pixelRatio: 2 }); } catch(_) {}
    });
  }

  // pastikan setiap instance MapLibre terpasang registerDefaultIcons
  function wrapCtor(){
    if (!window.maplibregl || !maplibregl.Map || maplibregl.__inlineIconCtorWrapped) return;
    var Orig = maplibregl.Map;
    function Wrapped(opts){ var m = new Orig(opts); try{ registerDefaultIcons(m); }catch(e){} return m; }
    Wrapped.prototype = Orig.prototype;
    window.maplibregl.Map = Wrapped;
    maplibregl.__inlineIconCtorWrapped = true;
  }
  wrapCtor();
  var iv = setInterval(function(){ wrapCtor(); if (window.maplibregl && maplibregl.__inlineIconCtorWrapped) clearInterval(iv); }, 100);

  // jika peta sudah ada sebelum wrap aktif, coba deteksi global 'map' yang umum dipakai
  window.addEventListener('load', function(){
    try { if (window.map && typeof map.on === 'function') registerDefaultIcons(map); } catch(e) {}
  });
})();
</script>
