<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>STMSPS (GitHub Pages Version)</title>

<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
  :root { --accent:#1a237e; --panel:#ffffff; --shadow:0 8px 26px rgba(0,0,0,0.12); }
  html,body { height:100%; margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, 'Fira Sans', Arial, sans-serif; background:#f5f7fb; }
  #map { position:absolute; inset:0; }
  #topbar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:10; background:var(--accent); color:#fff; border-radius:12px; box-shadow:var(--shadow); padding:8px 10px; display:flex; gap:8px; align-items:center; }
  #topbar select, #topbar button { border-radius:8px; border:0; padding:8px 10px; font-weight:600; }
  #topbar select { color:#000; }
  #topbar .btn { background:#ffc107; color:#000; cursor:pointer; }
  #panel { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10; width:380px; background:var(--panel); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  #panel header { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-bottom:1px solid #eee; }
  #panel header h4 { margin:0; font-size:14px; }
  #panel .tabs { display:flex; gap:6px; padding:8px; }
  #panel .tabs button { flex:1; border:1px solid #ddd; background:#f8f9fa; color:#333; border-radius:8px; padding:8px; font-weight:700; cursor:pointer; }
  #panel .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  #panel .body { padding:10px; max-height:45vh; overflow:auto; }
  .legend-item { display:flex; gap:10px; align-items:center; margin-bottom:7px; font-size:13px; }
  .legend-icon { width:26px; height:18px; display:flex; align-items:center; justify-content:center; }
  .hidden { display:none; }
  @media (max-width:720px){ #panel{ width:94%; } #topbar{ left:10px; right:10px; transform:none; } }
</style>
</head>
<body>

<div id="map" aria-label="Peta STMSPS"></div>

<div id="topbar" role="group" aria-label="Kontrol Satwil dan Basemap">
  <label style="font-size:12px;font-weight:700;">Satwil</label>
  <select id="satwil-select" aria-label="Pilih Satwil"><option value="" disabled selected hidden>Memuat…</option></select>
  <button id="btn-apply" class="btn" aria-label="Terapkan Satwil">Terapkan</button>
  <label style="font-size:12px;font-weight:700;margin-left:8px;">Basemap</label>
  <select id="basemap">
    <option value="osm">OpenStreetMap</option>
    <option value="esri">ESRI World Topo</option>
    <option value="imagery">World Imagery</option>
  </select>
</div>

<div id="panel">
  <header>
    <h4>Pengaturan Layer & Legenda</h4>
    <button id="toggle-panel" class="btn" style="background:#eef; color:#000;">Tutup/Buka</button>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="layers">Layer</button>
    <button class="tab" data-tab="legend">Legenda</button>
  </div>
  <div class="body" id="tab-layers">
    <div>
      <label><input type="checkbox" class="layer-toggle" data-layer="troublespot" checked> Troublespot</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="blackspot" checked> Black Spot</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="traffic" checked> Kemacetan</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="blacklink" checked> Black Link</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="blackarea" checked> Black Area</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="objek_vital" checked> Objek Vital</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="cctv" checked> CCTV</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="prediksi_risiko"> Prediksi Risiko Kecelakaan</label><br>
      <label><input type="checkbox" class="layer-toggle" data-layer="administrasi" checked> Wilayah Administrasi</label>
    </div>
  </div>
  <div class="body hidden" id="tab-legend">
    <div class="legend-item"><div class="legend-icon" style="background:#e53935;border-radius:3px;"></div> Jalan Ditutup</div>
    <div class="legend-item"><div class="legend-icon" style="background:#ffc107;border-radius:3px;"></div> Gangguan Jalan</div>
    <div class="legend-item"><div class="legend-icon" style="background:#d32f2f;border-radius:3px;"></div> Titik Kemacetan / Kecelakaan</div>
    <div class="legend-item"><div class="legend-icon" style="background:#000;border-radius:3px;"></div> Black Link</div>
    <div class="legend-item"><div class="legend-icon" style="background:#C0C0C0;border-radius:3px;"></div> Black Area</div>
    <div class="legend-item"><div class="legend-icon" style="background:#00e676;border-radius:3px;"></div> CCTV Hidup</div>
    <div class="legend-item"><div class="legend-icon" style="background:#e74c3c;border-radius:3px;"></div> CCTV Mati</div>
  </div>
</div>

<script>
// ========= KONFIG: Semua data dari folder lokal ./data =========
const DATA_PATH = './data';
// Nama file mengikuti mapping ini (silakan sesuaikan nama file Anda di folder /data)
const FILES = {
  wilayah:         'wilayah.geojson',
  troublespot:     'troublespot.geojson',
  blackspot:       'blackspot.geojson',
  traffic:         'traffic.geojson',
  blacklink:       'blacklink.geojson',
  blackarea:       'blackarea.geojson',
  cctv:            'cctv.geojson',
  objek_vital:     'objek_vital.geojson',
  prediksi_risiko: 'risk_prediction.geojson',    // ganti jika nama file beda
  administrasi:    'kependudukan.geojson',       // ganti jika nama file beda
  data_kecelakaan: 'data_kecelakaan.geojson'     // opsional (untuk analitik)
};

const basemapTiles = {
  osm: { tiles:['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256 },
  esri:{ tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'], tileSize:256 },
  imagery:{ tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256 }
};

let map, wilayahData, selectedSatwilFeature = null;
let filtered = {}; // cache data hasil filter per layer

function switchBasemap(key){
  const layers = map.getStyle().layers || [];
  const firstNonBase = layers.find(l => l.id !== 'base-raster-layer')?.id;
  if (map.getLayer('base-raster-layer')) map.removeLayer('base-raster-layer');
  if (map.getSource('base-raster')) map.removeSource('base-raster');
  map.addSource('base-raster', { type:'raster', tiles: basemapTiles[key].tiles, tileSize: basemapTiles[key].tileSize });
  if (firstNonBase) map.addLayer({ id:'base-raster-layer', type:'raster', source:'base-raster' }, firstNonBase);
  else map.addLayer({ id:'base-raster-layer', type:'raster', source:'base-raster' });
}

async function fetchLocal(key){
  const fname = FILES[key];
  if (!fname) return { type:'FeatureCollection', features:[] };
  const res = await fetch(`${DATA_PATH}/${fname}`, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`Gagal memuat ${fname}: ${res.status}`);
  return await res.json();
}

function toPointFeatures(fc){
  const out = [];
  for (const f of (fc.features || [])){
    const g = f.geometry;
    if (!g) continue;
    if (g.type === 'Point') out.push(f);
    else if (g.type === 'MultiPoint'){
      (g.coordinates || []).forEach(c => out.push({ type:'Feature', geometry:{ type:'Point', coordinates:c }, properties:{...f.properties} }));
    } else {
      try {
        const cen = turf.centroid(f).geometry.coordinates;
        out.push({ type:'Feature', geometry:{ type:'Point', coordinates:cen }, properties:{...f.properties, _from:g.type} });
      } catch {}
    }
  }
  return { type:'FeatureCollection', features: out };
}

function filterByPolygon(layerKey, fc, polygon){
  if (!polygon) return fc;
  const pointLayers = ['cctv','objek_vital','troublespot','blackspot'];
  if (pointLayers.includes(layerKey)){
    const pts = toPointFeatures(fc);
    pts.features = pts.features.filter(pt => {
      try { return turf.booleanPointInPolygon(pt, polygon); } catch { return false; }
    });
    return pts;
  }
  // non-point → intersect
  return {
    type:'FeatureCollection',
    features: (fc.features || []).filter(f => {
      try { return turf.booleanIntersects(f, polygon); } catch { return false; }
    })
  };
}

function prop(obj, keys, fallback=null){
  for (const k of keys){
    if (obj && obj[k] != null) return obj[k];
  }
  return fallback;
}

function popupForFeature(feat, layerKey){
  const p = feat.properties || {};
  const alias = {
    city:'Kabupaten/Kota', street:'Jalan', keterangan:'Keterangan',
    Nm_Ruas:'Nama Ruas Jalan', Status:'Status Jalan', Propinsi:'Provinsi',
    Kab_Kot:'Kabupaten/Kota', SkorBS:'Skor Black Spot', Ket:'Keterangan',
    level:'Level Kemacetan', speedKMH:'Kecepatan', Nama:'Nama',
    nama_cctv:'Nama CCTV', status:'Status', sumber:'Sumber',
    nama_jalan:'Nama Jalan', risk_prediction:'Risiko Kecelakaan',
    nama_prop:'Nama Provinsi', nama_kab:'Kab/Kota', nama_kec:'Kecamatan'
  };
  let html = '';
  Object.keys(alias).forEach(k => {
    if (p[k] != null) html += `<div><strong>${alias[k]}:</strong> ${p[k]}</div>`;
  });
  if (!html) html = '<em>Tidak ada informasi detail.</em>';
  return `<div style="font-weight:700;margin-bottom:6px">${layerKey.replace('_',' ')}</div>${html}`;
}

function addOrUpdateSource(id, data){
  if (map.getSource(id)) map.getSource(id).setData(data);
  else map.addSource(id, { type:'geojson', data });
}

function layerVisible(prefix){ const el = document.querySelector(`.layer-toggle[data-layer="${prefix}"]`); return el?.checked; }

async function loadAllLayersForSatwil(polygon){
  const order = ['administrasi','blackarea','traffic','prediksi_risiko','blacklink','cctv','objek_vital','blackspot','troublespot'];

  // bersihkan layer lama
  for (const id of (map.getStyle().layers || []).map(l=>l.id)){
    if (/^(troublespot|blackspot|traffic|blacklink|blackarea|cctv|objek_vital|prediksi_risiko|administrasi)/.test(id)){
      if (map.getLayer(id)) map.removeLayer(id);
    }
  }
  for (const sid of Object.keys(map.getStyle().sources || {})){
    if (/^(troublespot|blackspot|traffic|blacklink|blackarea|cctv|objek_vital|prediksi_risiko|administrasi)/.test(sid)){
      if (map.getSource(sid)) map.removeSource(sid);
    }
  }

  filtered = {};
  for (const key of order){
    try {
      const raw = await fetchLocal(key);
      const fc  = filterByPolygon(key, raw, polygon);
      filtered[key] = fc;

      switch (key){
        case 'troublespot':
          addOrUpdateSource('troublespot', fc);
          map.addLayer({
            id:'troublespot-symbol', type:'circle', source:'troublespot',
            paint:{ 'circle-radius':5, 'circle-color':'#d32f2f', 'circle-stroke-color':'#fff', 'circle-stroke-width':1 }
          });
          break;
        case 'blackspot':
          addOrUpdateSource('blackspot', fc);
          map.addLayer({ id:'blackspot-symbol', type:'circle', source:'blackspot', paint:{ 'circle-radius':6, 'circle-color':'#000', 'circle-stroke-color':'#e53935', 'circle-stroke-width':2 } });
          break;
        case 'traffic':
          addOrUpdateSource('traffic', fc);
          map.addLayer({ id:'traffic-line', type:'line', source:'traffic', paint:{ 'line-width':2, 'line-color':['interpolate',['linear'],['get','level'],1,'#ffeb3b',3,'#f44336',5,'#5d4037'], 'line-opacity':0.8 } });
          break;
        case 'blacklink':
          addOrUpdateSource('blacklink', fc);
          map.addLayer({ id:'blacklink-outline', type:'line', source:'blacklink', paint:{ 'line-width':4, 'line-color':'#212121' } });
          map.addLayer({ id:'blacklink-line', type:'line', source:'blacklink', paint:{ 'line-width':2, 'line-color':'#e53935' } });
          break;
        case 'blackarea':
          addOrUpdateSource('blackarea', fc);
          map.addLayer({ id:'blackarea-fill', type:'fill', source:'blackarea', paint:{ 'fill-color':'#C0C0C0', 'fill-opacity':0.4 } });
          map.addLayer({ id:'blackarea-outline', type:'line', source:'blackarea', paint:{ 'line-color':'#000', 'line-width':1 } });
          break;
        case 'cctv':
          const onFC  = { type:'FeatureCollection', features: (fc.features||[]).filter(f => String(prop(f.properties, ['status','STATUS','stat'],'')).toLowerCase().includes('hidup')) };
          const offFC = { type:'FeatureCollection', features: (fc.features||[]).filter(f => String(prop(f.properties, ['status','STATUS','stat'],'')).toLowerCase().includes('mati')) };
          addOrUpdateSource('cctv-on', onFC);
          addOrUpdateSource('cctv-off', offFC);
          map.addLayer({ id:'cctv-on-pts', type:'circle', source:'cctv-on', paint:{ 'circle-radius':5, 'circle-color':'#00e676', 'circle-stroke-color':'#fff', 'circle-stroke-width':1 } });
          map.addLayer({ id:'cctv-off-pts', type:'circle', source:'cctv-off', paint:{ 'circle-radius':5, 'circle-color':'#e74c3c', 'circle-stroke-color':'#fff', 'circle-stroke-width':1 } });
          break;
        case 'objek_vital':
          addOrUpdateSource('objek_vital', fc);
          map.addLayer({ id:'objek_vital-pts', type:'circle', source:'objek_vital', paint:{ 'circle-radius':5, 'circle-color':'#3949ab', 'circle-stroke-color':'#fff', 'circle-stroke-width':1 } });
          break;
        case 'prediksi_risiko':
          addOrUpdateSource('prediksi_risiko', fc);
          map.addLayer({ id:'prediksi_risiko-line', type:'line', source:'prediksi_risiko', paint:{ 'line-width':2, 'line-color':['match',['get','risk_prediction'],0,'#4caf50',1,'#ffeb3b',2,'#f44336','#9e9e9e'], 'line-opacity':0.95 } });
          break;
        case 'administrasi':
          addOrUpdateSource('administrasi', fc);
          map.addLayer({ id:'administrasi-fill', type:'fill', source:'administrasi', paint:{ 'fill-color':'#2196f3', 'fill-opacity':0.1 } });
          map.addLayer({ id:'administrasi-outline', type:'line', source:'administrasi', paint:{ 'line-color':'#ffffff', 'line-width':1.5 } });
          break;
      }
    } catch (e){
      console.warn(key, 'gagal dimuat:', e);
    }
  }

  // visibilitas sesuai checkbox
  document.querySelectorAll('.layer-toggle').forEach(cb => {
    const k = cb.dataset.layer;
    const ids = (map.getStyle().layers || []).map(l=>l.id).filter(id => id.startsWith(k) || (k==='cctv' && (id.startsWith('cctv-on') || id.startsWith('cctv-off'))) || (k==='objek_vital' && id.startsWith('objek_vital')));
    ids.forEach(id => map.setLayoutProperty(id, 'visibility', cb.checked ? 'visible' : 'none'));
  });

  // popups
  map.on('click', (e) => {
    const feats = map.queryRenderedFeatures(e.point);
    if (!feats.length) return;
    const f = feats[0];
    const key = f.layer.id.split('-')[0];
    const center = f.geometry.type === 'Point' ? f.geometry.coordinates : e.lngLat.toArray();
    new maplibregl.Popup({ offset:12 }).setLngLat(center).setHTML(popupForFeature(f, key)).addTo(map);
  });
}

async function init(){
  map = new maplibregl.Map({
    container:'map',
    style:{ version:8, sources:{ 'base-raster':{ type:'raster', tiles: basemapTiles.osm.tiles, tileSize:basemapTiles.osm.tileSize } }, layers:[{ id:'base-raster-layer', type:'raster', source:'base-raster' }] },
    center:[118.0149,-2.5489], zoom:4.8, attributionControl:false
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'top-right');
  map.addControl(new maplibregl.AttributionControl({ compact:true }), 'bottom-right');

  // muat wilayah → isi dropdown
  wilayahData = await fetchLocal('wilayah');
  const sel = document.getElementById('satwil-select');
  sel.innerHTML = '<option value="" disabled hidden>Pilih Satwil</option>';
  const seen = new Set();
  (wilayahData.features || []).forEach(f => {
    const sat = prop(f.properties, ['Satwil', 'satwil']);
    if (sat && !seen.has(sat)){
      seen.add(sat);
      const o = document.createElement('option');
      o.value = sat; o.textContent = sat;
      sel.appendChild(o);
    }
  });

  document.getElementById('btn-apply').onclick = () => {
    const v = sel.value;
    if (!v) return alert('Pilih Satwil terlebih dahulu');
    const feat = (wilayahData.features || []).find(f => prop(f.properties, ['Satwil','satwil']) === v);
    if (!feat) return alert('Satwil tidak ditemukan di data wilayah');
    selectedSatwilFeature = feat;
    loadAllLayersForSatwil(feat);
    try { map.fitBounds(turf.bbox(feat), { padding:40, maxZoom:14 }); } catch {}
  };

  document.getElementById('basemap').onchange = (e) => switchBasemap(e.target.value);

  // tabs
  document.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-layers').classList.toggle('hidden', btn.dataset.tab!=='layers');
      document.getElementById('tab-legend').classList.toggle('hidden', btn.dataset.tab!=='legend');
    };
  });

  // layer toggles
  document.querySelectorAll('.layer-toggle').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.layer;
      const ids = (map.getStyle().layers || []).map(l=>l.id).filter(id => id.startsWith(k) || (k==='cctv' && (id.startsWith('cctv-on') || id.startsWith('cctv-off'))) || (k==='objek_vital' && id.startsWith('objek_vital')));
      ids.forEach(id => map.setLayoutProperty(id, 'visibility', cb.checked ? 'visible' : 'none'));
    };
  });

  document.getElementById('toggle-panel').onclick = () => {
    const bodyLayers = document.getElementById('tab-layers');
    const bodyLegend = document.getElementById('tab-legend');
    const hidden = bodyLayers.classList.contains('hidden') && bodyLegend.classList.contains('hidden');
    bodyLayers.classList.toggle('hidden', !hidden);
    if (!hidden) bodyLegend.classList.add('hidden');
  };
}

init();
</script>

</body>
</html>
